name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Read Rust version and REGEX_SHA from Dockerfile
        id: dockerfile
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re, sys
          text = pathlib.Path("Dockerfile").read_text(encoding="utf-8")
          m_rust = re.search(r"^FROM\s+rust:([0-9]+\.[0-9]+(?:\.[0-9]+)?)-", text, flags=re.MULTILINE)
          m_sha = re.search(r"^ARG\s+REGEX_SHA=([0-9a-f]{40})\b", text, flags=re.MULTILINE)
          if not m_rust or not m_sha:
              sys.exit("Failed to parse FROM rust:<ver> and ARG REGEX_SHA from Dockerfile")
          print(f"rust_version={m_rust.group(1)}")
          print(f"regex_sha={m_sha.group(1)}")
          PY

      - name: Install Rust toolchain matching Dockerfile
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.dockerfile.outputs.rust_version }}

      - name: Clone rust-lang/regex at Dockerfile REGEX_SHA
        if: runner.os == 'Linux'
        shell: bash
        env:
          REGEX_SHA: ${{ steps.dockerfile.outputs.regex_sha }}
        run: |
          git clone --quiet https://github.com/rust-lang/regex.git ./regex
          git -C ./regex checkout --quiet --detach "$REGEX_SHA"

      - name: Cache Cargo registry, git, and noise-bench target
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            noise-bench/target/
          key: ${{ runner.os }}-cargo-${{ steps.dockerfile.outputs.rust_version }}-${{ steps.dockerfile.outputs.regex_sha }}-${{ hashFiles('noise-bench/Cargo.lock', 'noise-bench/Cargo.toml', 'noise-bench/src/**', 'noise-bench/haystacks/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.dockerfile.outputs.rust_version }}-${{ steps.dockerfile.outputs.regex_sha }}-
            ${{ runner.os }}-cargo-${{ steps.dockerfile.outputs.rust_version }}-

      - name: Build noise-bench release binary
        if: runner.os == 'Linux'
        shell: bash
        run: cargo build --release --manifest-path noise-bench/Cargo.toml

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        env:
          REQUIRE_RUST_BINARY: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: pytest --cov=core --cov=adapters --cov=server --cov-report=term-missing
